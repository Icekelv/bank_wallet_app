name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tool/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow publish each APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      APP_NAME: ${{ vars.APP_NAME || 'mono' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check settings
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Add a repository variable API_BASE_URL (Settings > Secrets and variables > Actions > Variables), e.g. https://your-site.com/monofin"
            exit 1
          fi
          echo "Backend: $API_BASE_URL"

      - name: Generate Android project
        run: flutter create --org com.monofin --project-name monofin --platforms android .

      - name: Firebase settings (push notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > /tmp/google-services.json
            PKG=$(python3 ../tool/gen_firebase_options.py /tmp/google-services.json lib/firebase_options.dart "${{ vars.APP_ID }}")
            echo "APP_ID=$PKG" >> "$GITHUB_ENV"
            echo "Firebase configured for package $PKG"
          else
            echo "::warning::Secret GOOGLE_SERVICES_JSON is not set, so this APK has no push notifications."
            echo "APP_ID=${{ vars.APP_ID || 'com.monofin.app' }}" >> "$GITHUB_ENV"
          fi

      - name: Adjust Android project
        run: python3 ../tool/patch_android.py

      - name: Signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using the signing key from secrets."
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            mkdir -p ../signing-key
            base64 -w0 ~/.android/debug.keystore > ../signing-key/DEBUG_KEYSTORE_BASE64.txt
            echo "::warning::No DEBUG_KEYSTORE_BASE64 secret, so a new signing key was made. Download the 'signing-key' artifact and save its text as that secret, otherwise each new APK must be uninstalled before installing the next."
          fi

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.ap
